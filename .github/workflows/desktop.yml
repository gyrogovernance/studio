name: Desktop installers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['dev/**', '**/*.md']
  pull_request:
    branches: [main]
    paths-ignore: ['dev/**', '**/*.md']

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Desktop (${{ matrix.os }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: macos-latest
            arch: arm64
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.2'
      - run: npm ci
      - run: npm run desktop:build -- --${{ matrix.arch }}
      - name: Check packaged contents
        run: uv run --no-project --python 3.12 scripts/check-desktop-package.py
      - uses: actions/upload-artifact@v4
        with:
          name: ai-inspector-studio-${{ runner.os }}-${{ matrix.arch }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.zip
          if-no-files-found: error
