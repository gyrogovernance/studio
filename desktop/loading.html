<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self'" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>AI Inspector Studio</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #141414; color: #eee; }
      main { max-width: 36rem; padding: 3rem; text-align: center; }
      h1 { font-size: 1.5rem; font-weight: 500; }
      p { color: #b9b9b9; line-height: 1.6; }
      #status { min-height: 3rem; }
      .spinner { margin: 2rem auto; width: 24px; height: 24px; border: 2px solid #444; border-top-color: #8bbaff; border-radius: 50%; animation: spin 1s linear infinite; }
      small { color: #888; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
    </style>
  </head>
  <body>
    <main>
      <h1>AI Inspector Studio</h1>
      <div class="spinner" aria-hidden="true"></div>
      <p id="status" role="status" aria-live="polite">Starting your workspace…</p>
      <p id="detail"></p>
      <small>Built on Open WebUI</small>
    </main>
  </body>
</html>
